[project]
name = "adamlife-api"
version = "0.1.0"
description = "AdamLife 2.0 backend infrastructure"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["postgres: requires an explicitly configured disposable PostgreSQL database"]
